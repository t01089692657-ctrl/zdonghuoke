[project]
name = "zdhk-api"
version = "0.1.0"
description = "ZDHK 自动获客系统 —— 后端 API（模块化单体 + 端口与适配器）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",           # Postgres 异步驱动（cloud/docker）
    "aiosqlite>=0.20",         # SQLite 异步驱动（Mac mini 零 Docker 本地）
    "greenlet>=3.1",
    "structlog>=24.4",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "tenacity>=9.0",           # 外部调用重试
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]
# 仅云端真实发送(SES)需要；本地 fake 模式无需安装。用 `uv sync --extra cloud`。
cloud = [
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() 惯用法

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
